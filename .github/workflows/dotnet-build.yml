name: .NET Build

on:
  push:
    branches:
      - main
    paths:
      - "examples/dotnet-basic/**"
      - ".github/workflows/dotnet-build.yml"

  pull_request:
    paths:
      - "examples/dotnet-basic/**"
      - ".github/workflows/dotnet-build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test .NET
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/dotnet-basic

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore EnterpriseActions.sln

      - name: Build solution
        run: |
          dotnet build EnterpriseActions.sln \
            --configuration Release \
            --no-restore

      - name: Run tests
        run: |
          dotnet test EnterpriseActions.sln \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults

      - name: Pack library
        run: |
          dotnet pack \
            src/EnterpriseActions.Core/EnterpriseActions.Core.csproj \
            --configuration Release \
            --no-build \
            --output artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v5
        with:
          name: dotnet-nuget-package
          path: examples/dotnet-basic/artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dotnet-test-results
          path: examples/dotnet-basic/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7