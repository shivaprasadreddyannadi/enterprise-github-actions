name: Python Build

on:
  push:
    branches:
      - main
    paths:
      - "examples/python-basic/**"
      - ".github/workflows/python-build.yml"

  pull_request:
    paths:
      - "examples/python-basic/**"
      - ".github/workflows/python-build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint and Test Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/python-basic

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            examples/python-basic/requirements.txt
            examples/python-basic/requirements-dev.txt

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check .

      - name: Run tests
        run: pytest --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: python-test-results
          path: examples/python-basic/test-results.xml
          if-no-files-found: error
          retention-days: 7