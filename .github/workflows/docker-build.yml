name: Docker Build

on:
  push:
    branches:
      - main
    paths:
      - "examples/docker-basic/**"
      - ".github/workflows/docker-build.yml"

  pull_request:
    paths:
      - "examples/docker-basic/**"
      - ".github/workflows/docker-build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: Build and Test Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: examples/docker-basic
          file: examples/docker-basic/Dockerfile
          push: false
          load: true
          tags: enterprise-github-actions:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run --detach \
            --name enterprise-actions-demo \
            --publish 8080:80 \
            enterprise-github-actions:local

      - name: Wait for container health
        run: |
          for attempt in {1..10}; do
            status="$(docker inspect \
              --format='{{.State.Health.Status}}' \
              enterprise-actions-demo)"

            echo "Container health: ${status}"

            if [ "${status}" = "healthy" ]; then
              exit 0
            fi

            sleep 3
          done

          docker logs enterprise-actions-demo
          exit 1

      - name: Test web endpoint
        run: |
          curl --fail --silent http://localhost:8080 \
            | grep "Enterprise GitHub Actions"

      - name: Show container logs on failure
        if: failure()
        run: docker logs enterprise-actions-demo

      - name: Remove test container
        if: always()
        run: docker rm --force enterprise-actions-demo