name: Trivy Security Scan

on:
  push:
    branches:
      - main
    paths:
      - "examples/docker-basic/**"
      - "examples/terraform-basic/**"
      - ".github/workflows/trivy-security-scan.yml"

  pull_request:
    paths:
      - "examples/docker-basic/**"
      - "examples/terraform-basic/**"
      - ".github/workflows/trivy-security-scan.yml"

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  filesystem-scan:
    name: Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: examples/docker-basic
          file: examples/docker-basic/Dockerfile
          push: false
          load: true
          tags: enterprise-github-actions:security-scan

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: enterprise-github-actions:security-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"