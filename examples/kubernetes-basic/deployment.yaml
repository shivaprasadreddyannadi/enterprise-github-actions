apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-demo
  namespace: enterprise-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: enterprise-demo

  template:
    metadata:
      labels:
        app: enterprise-demo

    spec:
      containers:
        - name: enterprise-demo
          image: nginx:1.27-alpine

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi